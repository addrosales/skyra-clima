<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SKYRA — Clima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f5f7fb;
    --ink-dim:rgba(245,247,251,0.58);
    --ink-faint:rgba(245,247,251,0.34);
    --glass:rgba(255,255,255,0.07);
    --glass-strong:rgba(255,255,255,0.12);
    --glass-border:rgba(255,255,255,0.14);
    --gold:#ffcf6b;
    --alert:#ff8a80;
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:14px;
    --g1:#101726; --g2:#1c2b45; --g3:#33507a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(120% 60% at 15% -10%, var(--g3) 0%, transparent 60%),
      linear-gradient(165deg, var(--g1) 0%, var(--g2) 55%, var(--g1) 100%);
    background-color:var(--g1);
    transition:background 1.1s ease;
    overflow-x:hidden;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:22px 18px 46px;
    position:relative;
    z-index:2;
  }
  /* ---------- signature: living sky layer ---------- */
  .sky{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .sun{position:absolute; top:8%; right:12%; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff7d6, var(--gold) 45%, transparent 72%);
    filter:blur(1px); opacity:.85; animation:pulse 6s ease-in-out infinite;}
  .rays{position:absolute; top:8%; right:12%; width:150px; height:150px; animation:spin 90s linear infinite; opacity:.5;}
  .rays div{position:absolute; left:50%; top:50%; width:2px; height:74px; background:linear-gradient(var(--gold),transparent);
    transform-origin:0 0;}
  .moon{position:absolute; top:9%; right:14%; width:86px; height:86px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #eef2ff, #c7d3ea 55%, transparent 78%); opacity:.8; box-shadow:0 0 40px rgba(200,215,255,.25);}
  .stars{position:absolute; inset:0;}
  .stars span{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; opacity:.6; animation:twinkle 3.5s ease-in-out infinite;}
  .cloud-layer{position:absolute; inset:0;}
  .cloud{position:absolute; opacity:.5; filter:blur(.3px); animation:drift linear infinite;}
  .cloud svg{width:100%; height:100%; display:block;}
  .rain{position:absolute; inset:0; overflow:hidden;}
  .drop{position:absolute; top:-8%; width:1.5px; height:16px; background:linear-gradient(rgba(200,225,255,.55),transparent); animation:fall linear infinite;}
  .snow{position:absolute; inset:0; overflow:hidden;}
  .flake{position:absolute; top:-4%; border-radius:50%; background:#fff; opacity:.85; animation:snowfall linear infinite;}
  .bolt{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; animation:flash 7s ease-in-out infinite;}
  .fogband{position:absolute; left:-10%; width:120%; height:60px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
    filter:blur(6px); animation:drift linear infinite;}

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:.85}50%{transform:scale(1.06); opacity:1}}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.85}}
  @keyframes drift{from{transform:translateX(-15%)}to{transform:translateX(115%)}}
  @keyframes fall{from{transform:translateY(-10%)}to{transform:translateY(115vh)}}
  @keyframes snowfall{from{transform:translateY(-6%) translateX(0) rotate(0)}to{transform:translateY(112vh) translateX(24px) rotate(180deg)}}
  @keyframes flash{0%,96%,100%{opacity:0}97%{opacity:.5}98%{opacity:0}99%{opacity:.35}}

  @media (prefers-reduced-motion:reduce){
    .sun,.rays,.stars span,.cloud,.drop,.flake,.bolt,.fogband{animation:none !important;}
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .place{display:flex; align-items:center; gap:8px;}
  .place svg{width:16px; height:16px; opacity:.75;}
  .place-name{font-size:15px; font-weight:600; letter-spacing:.2px;}
  .updated{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .iconbtn{width:38px; height:38px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .3s ease, background .2s;}
  .iconbtn:active{transform:scale(.9);}
  .iconbtn svg{width:17px; height:17px; opacity:.9;}
  .iconbtn.spin svg{animation:spin 1s linear infinite;}

  /* ---------- hero ---------- */
  .hero{text-align:center; padding:8px 0 26px;}
  .hero-icon{width:104px; height:104px; margin:0 auto 6px;}
  .temp{font-family:'Manrope',sans-serif; font-weight:200; font-size:112px; line-height:.95; letter-spacing:-4px;}
  .temp sup{font-size:44px; font-weight:200; letter-spacing:0;}
  .cond{font-size:17px; font-weight:600; margin-top:2px;}
  .feels{font-size:13px; color:var(--ink-dim); margin-top:6px;}
  .minmax{display:flex; gap:14px; justify-content:center; margin-top:10px; font-size:13px; color:var(--ink-dim);}
  .minmax b{color:var(--ink); font-weight:600;}

  /* ---------- hourly strip ---------- */
  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:1.4px; color:var(--ink-faint); font-weight:600; margin:26px 2px 12px;}
  .hourly{display:flex; gap:8px; overflow-x:auto; padding:6px 2px 4px; scrollbar-width:none;}
  .hourly::-webkit-scrollbar{display:none;}
  .hour-card{flex:0 0 auto; width:60px; background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-sm);
    padding:12px 0 10px; text-align:center;}
  .hour-card .h-time{font-size:11px; color:var(--ink-dim); font-weight:500;}
  .hour-card svg{width:26px; height:26px; margin:8px 0 6px;}
  .hour-card .h-temp{font-size:14px; font-weight:700;}
  .hour-card .h-pop{font-size:10px; color:#7fc4ff; margin-top:3px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex; background:var(--glass); border:1px solid var(--glass-border); border-radius:999px; padding:4px; margin-top:8px; position:relative;}
  .tab{flex:1; text-align:center; padding:9px 0; font-size:13px; font-weight:600; color:var(--ink-dim); border-radius:999px; cursor:pointer;
    position:relative; z-index:1; transition:color .25s;}
  .tab.active{color:#0d1420;}
  .tab-indicator{position:absolute; top:4px; left:4px; height:calc(100% - 8px); width:calc(33.333% - 4px);
    background:var(--ink); border-radius:999px; transition:transform .35s cubic-bezier(.65,0,.35,1); z-index:0;}

  .panel{display:none; margin-top:16px;}
  .panel.active{display:block; animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:translateY(0)}}

  .row{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid rgba(255,255,255,.07);}
  .row:last-child{border-bottom:none;}
  .row .r-day{width:74px; font-size:13.5px; font-weight:600;}
  .row .r-sub{font-size:11px; color:var(--ink-faint); font-weight:400; margin-top:1px;}
  .row svg{width:24px; height:24px; flex:0 0 auto;}
  .row .r-pop{font-size:11px; color:#7fc4ff; width:34px;}
  .bar-wrap{flex:1; display:flex; align-items:center; gap:8px;}
  .bar-min,.bar-max{font-size:12.5px; font-weight:600; width:28px; text-align:center; color:var(--ink-dim);}
  .bar-track{flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.12); position:relative;}
  .bar-fill{position:absolute; top:0; bottom:0; border-radius:4px; background:linear-gradient(90deg,#7fc4ff,var(--gold));}

  .disclaimer{display:flex; gap:10px; background:rgba(255,138,128,.1); border:1px solid rgba(255,138,128,.28);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:12px; color:#ffd9d4; line-height:1.5; margin-bottom:10px;}
  .disclaimer svg{width:16px; height:16px; flex:0 0 auto; margin-top:1px;}
  .week-label{font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--ink-faint); margin:14px 4px 2px; text-transform:uppercase;}

  /* ---------- bento detail grid ---------- */
  .bento{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px;}
  .bcard{background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-md); padding:16px;}
  .bcard .b-label{font-size:11px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.6px; display:flex; align-items:center; gap:6px;}
  .bcard .b-label svg{width:13px; height:13px;}
  .bcard .b-value{font-family:'Manrope',sans-serif; font-size:26px; font-weight:600; margin-top:8px;}
  .bcard .b-value span{font-size:14px; font-weight:500; color:var(--ink-dim);}
  .bcard .b-note{font-size:11px; color:var(--ink-faint); margin-top:4px;}
  .sun-arc{position:relative; height:34px; margin-top:8px;}
  .sun-arc svg{width:100%; height:100%;}

  /* ---------- states ---------- */
  .state{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:0 20px;}
  .state svg{width:64px; height:64px; opacity:.7;}
  .state h2{font-family:'Manrope',sans-serif; font-weight:700; font-size:20px; margin:0;}
  .state p{font-size:13.5px; color:var(--ink-dim); line-height:1.6; margin:0; max-width:300px;}
  .btn{background:var(--ink); color:#0d1420; border:none; padding:13px 26px; border-radius:999px; font-weight:700;
    font-size:14px; cursor:pointer; font-family:inherit;}
  .btn:active{transform:scale(.96);}
  .skeleton{background:linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.12), rgba(255,255,255,.05));
    background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:var(--radius-sm);}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .footer{text-align:center; margin-top:34px;}
  .brand{font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; letter-spacing:3px;}
  .brand span{color:var(--gold);}
  .attrib{font-size:10.5px; color:var(--ink-faint); margin-top:6px; line-height:1.6;}
  a{color:inherit;}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="app" id="app">
  <div class="state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="10" r="3.4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <h2>SKYRA</h2>
    <p>Para darte un pronóstico real y no uno genérico, SKYRA necesita tu ubicación precisa (GPS). Nunca se guarda ni se comparte.</p>
    <button class="btn" onclick="init()">Activar ubicación</button>
  </div>
</div>

<script>
const WMO = {
  0:{t:'Despejado', theme:'clear'},
  1:{t:'Mayormente despejado', theme:'clear'},
  2:{t:'Parcialmente nublado', theme:'cloudy'},
  3:{t:'Nublado', theme:'cloudy'},
  45:{t:'Niebla', theme:'fog'}, 48:{t:'Niebla helada', theme:'fog'},
  51:{t:'Llovizna ligera', theme:'rain'}, 53:{t:'Llovizna', theme:'rain'}, 55:{t:'Llovizna densa', theme:'rain'},
  56:{t:'Llovizna helada', theme:'rain'}, 57:{t:'Llovizna helada densa', theme:'rain'},
  61:{t:'Lluvia ligera', theme:'rain'}, 63:{t:'Lluvia', theme:'rain'}, 65:{t:'Lluvia fuerte', theme:'rain'},
  66:{t:'Lluvia helada', theme:'rain'}, 67:{t:'Lluvia helada fuerte', theme:'rain'},
  71:{t:'Nieve ligera', theme:'snow'}, 73:{t:'Nieve', theme:'snow'}, 75:{t:'Nieve fuerte', theme:'snow'},
  77:{t:'Granos de nieve', theme:'snow'},
  80:{t:'Chubascos ligeros', theme:'rain'}, 81:{t:'Chubascos', theme:'rain'}, 82:{t:'Chubascos violentos', theme:'rain'},
  85:{t:'Chubascos de nieve', theme:'snow'}, 86:{t:'Chubascos de nieve fuertes', theme:'snow'},
  95:{t:'Tormenta eléctrica', theme:'storm'}, 96:{t:'Tormenta con granizo', theme:'storm'}, 99:{t:'Tormenta severa', theme:'storm'}
};

const THEMES = {
  clear_day:['#1c3a5e','#2f6fb0','#8fd0ee'],
  clear_night:['#04060f','#0e1430','#232c58'],
  cloudy:['#232a36','#3d4654','#66717f'],
  fog:['#2b303a','#41474f','#636a72'],
  rain:['#141c2a','#232c3d','#3f516a'],
  snow:['#1c2635','#38455c','#7f92ab'],
  storm:['#0b0d13','#141821','#282f3d']
};

const ICONS = {
  sunny: `<svg viewBox="0 0 24 24" fill="none" stroke="#ffcf6b" stroke-width="1.6"><circle cx="12" cy="12" r="4.6" fill="#ffcf6b" stroke="none"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke-linecap="round"/></svg>`,
  moon: `<svg viewBox="0 0 24 24" fill="#cdd8f2" stroke="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.8 6.8 0 0 0 20 14.5z"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="#c7cfda" stroke-width="1.5"><path d="M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6-1.7A4.2 4.2 0 0 0 7 18z" stroke-linejoin="round"/></svg>`,
  partly: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="8" cy="9" r="3.4" fill="#ffcf6b" stroke="none"/><path d="M9.5 17h8a3.6 3.6 0 0 0 0-7.2 5 5 0 0 0-9.3-1.9" stroke="#c7cfda" stroke-linejoin="round"/></svg>`,
  fog: `<svg viewBox="0 0 24 24" fill="none" stroke="#c7cfda" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h13M3 13h16M4 17h13"/></svg>`,
  rain: `<svg viewBox="0 0 24 24" fill="none" stroke="#9fc9ec" stroke-width="1.6" stroke-linecap="round"><path d="M7 14h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.6A4.2 4.2 0 0 0 7 14z" stroke="#c7cfda"/><path d="M8 18l-1 2.4M12 18l-1 2.4M16 18l-1 2.4"/></svg>`,
  snow: `<svg viewBox="0 0 24 24" fill="none" stroke="#dfe8f5" stroke-width="1.5" stroke-linecap="round"><path d="M7 13h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.5A4.2 4.2 0 0 0 7 13z" stroke="#c7cfda"/><path d="M8 18v3M12 18v3M16 18v3M6.6 19.4l2.8 1.6M17.4 19.4l-2.8 1.6M9.4 19.4L6.6 21M14.6 19.4l2.8 1.6" opacity=".8"/></svg>`,
  storm: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M7 12h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5-1.3A4.2 4.2 0 0 0 7 12z" stroke="#c7cfda"/><path d="M13 13l-3.3 5h2.6L11 22l4-6h-2.4z" fill="#ffcf6b" stroke="none"/></svg>`
};

function iconFor(code, isDay){
  const w = WMO[code] || WMO[2];
  if(w.theme==='clear') return isDay? ICONS.sunny : ICONS.moon;
  if(w.theme==='cloudy') return code===2 ? (isDay?ICONS.partly:ICONS.cloud) : ICONS.cloud;
  if(w.theme==='fog') return ICONS.fog;
  if(w.theme==='rain') return ICONS.rain;
  if(w.theme==='snow') return ICONS.snow;
  if(w.theme==='storm') return ICONS.storm;
  return ICONS.cloud;
}

function themeKey(code, isDay){
  const w = WMO[code] || WMO[2];
  if(w.theme==='clear') return isDay?'clear_day':'clear_night';
  return w.theme;
}

function applyBackground(themeK){
  const [g1,g2,g3] = THEMES[themeK];
  document.documentElement.style.setProperty('--g1', g1);
  document.documentElement.style.setProperty('--g2', g2);
  document.documentElement.style.setProperty('--g3', g3);
}

function buildSky(themeK){
  const sky = document.getElementById('sky');
  sky.innerHTML = '';
  const isDay = themeK.includes('day') || themeK==='cloudy' || themeK==='fog' || themeK==='rain' || themeK==='snow' || themeK==='storm';
  if(themeK==='clear_day'){
    sky.innerHTML += '<div class="sun"></div>';
    let rays=''; for(let i=0;i<12;i++){ rays+=`<div style="transform:rotate(${i*30}deg) translate(75px,75px)"></div>`; }
    sky.innerHTML += `<div class="rays">${rays}</div>`;
  }
  if(themeK==='clear_night'){
    sky.innerHTML += '<div class="moon"></div>';
    let stars=''; for(let i=0;i<40;i++){
      const top=Math.random()*70, left=Math.random()*100, delay=Math.random()*3;
      stars+=`<span style="top:${top}%;left:${left}%;animation-delay:${delay}s"></span>`;
    }
    sky.innerHTML += `<div class="stars">${stars}</div>`;
  }
  if(themeK==='cloudy' || themeK==='fog'){
    sky.innerHTML += `<div class="fogband" style="top:22%; animation-duration:38s;"></div>
      <div class="fogband" style="top:48%; animation-duration:52s; animation-delay:-10s;"></div>`;
  }
  if(themeK==='rain'){
    let drops=''; for(let i=0;i<46;i++){
      const left=Math.random()*100, dur=(0.6+Math.random()*0.6).toFixed(2), delay=(Math.random()*2).toFixed(2);
      drops+=`<div class="drop" style="left:${left}%; animation-duration:${dur}s; animation-delay:-${delay}s;"></div>`;
    }
    sky.innerHTML += `<div class="rain">${drops}</div>`;
  }
  if(themeK==='snow'){
    let flakes=''; for(let i=0;i<34;i++){
      const left=Math.random()*100, size=(2+Math.random()*3).toFixed(1), dur=(6+Math.random()*6).toFixed(1), delay=(Math.random()*6).toFixed(1);
      flakes+=`<div class="flake" style="left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:-${delay}s;"></div>`;
    }
    sky.innerHTML += `<div class="snow">${flakes}</div>`;
  }
  if(themeK==='storm'){
    sky.innerHTML += `<div class="fogband" style="top:30%; animation-duration:44s;"></div><div class="bolt"></div>`;
    let drops=''; for(let i=0;i<30;i++){
      const left=Math.random()*100, dur=(0.5+Math.random()*0.5).toFixed(2), delay=(Math.random()*2).toFixed(2);
      drops+=`<div class="drop" style="left:${left}%; animation-duration:${dur}s; animation-delay:-${delay}s;"></div>`;
    }
    sky.innerHTML += `<div class="rain">${drops}</div>`;
  }
}

const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function fmtHour(iso){
  const d = new Date(iso);
  return d.getHours()+':00';
}
function fmtDayShort(iso){
  const d = new Date(iso+'T00:00:00');
  return DIAS_C[d.getDay()];
}
function fmtDayLong(iso, idx){
  const d = new Date(iso+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d-today)/86400000);
  if(diff===0) return 'Hoy';
  if(diff===1) return 'Mañana';
  return DIAS[d.getDay()];
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.getDate()+' '+MESES[d.getMonth()];
}

let STATE = null;

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="state">
    <div class="skeleton" style="width:64px;height:64px;border-radius:50%;"></div>
    <h2>Localizando…</h2>
    <p>Obteniendo tu posición GPS para un pronóstico exacto de tu zona.</p>
  </div>`;

  if(!('geolocation' in navigator)){
    app.innerHTML = errorState('Tu navegador no soporta geolocalización.', true);
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    try{
      await loadWeather(latitude, longitude);
    }catch(e){
      app.innerHTML = errorState('No se pudo obtener el clima. Revisa tu conexión e inténtalo de nuevo.', true);
    }
  }, (err)=>{
    app.innerHTML = errorState('Sin acceso a la ubicación, no podemos mostrar un pronóstico fiable. Actívala en los ajustes de ubicación de tu dispositivo (usa el proveedor de ubicación de Google en Android) y vuelve a intentarlo.', true);
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}

function errorState(msg, showBtn){
  return `<div class="state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 9v4M12 16.5h.01"/><path d="M10.3 3.9 1.8 18.5A1.8 1.8 0 0 0 3.4 21h17.2a1.8 1.8 0 0 0 1.6-2.5L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"/></svg>
    <h2>SKYRA</h2>
    <p>${msg}</p>
    ${showBtn?'<button class="btn" onclick="init()">Reintentar</button>':''}
  </div>`;
}

async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`);
    const j = await r.json();
    return j.city || j.locality || j.principalSubdivision || 'Tu ubicación';
  }catch(e){ return 'Tu ubicación'; }
}

async function loadWeather(lat, lon){
  const [place, wRes] = await Promise.all([
    reverseGeocode(lat, lon),
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,surface_pressure,precipitation&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset,wind_speed_10m_max,relative_humidity_2m_mean&timezone=auto&forecast_days=16`)
  ]);
  if(!wRes.ok) throw new Error('weather fetch failed');
  const data = await wRes.json();
  STATE = {place, data, lat, lon};
  render();
}

function render(){
  const {place, data} = STATE;
  const cur = data.current;
  const themeK = themeKey(cur.weather_code, cur.is_day);
  applyBackground(themeK);
  buildSky(themeK);

  const now = new Date();
  const nowHourIdx = data.hourly.time.findIndex(t => new Date(t) >= now);
  const startIdx = Math.max(0, nowHourIdx);
  let hourlyHtml = '';
  for(let i=startIdx; i<startIdx+24 && i<data.hourly.time.length; i++){
    const t = data.hourly.time[i];
    const label = i===startIdx ? 'Ahora' : fmtHour(t);
    const code = data.hourly.weather_code[i];
    const isDay = (new Date(t).getHours() >=6 && new Date(t).getHours()<19) ? 1 : 0;
    hourlyHtml += `<div class="hour-card">
      <div class="h-time">${label}</div>
      ${iconFor(code, isDay)}
      <div class="h-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
      <div class="h-pop">${data.hourly.precipitation_probability[i]}%</div>
    </div>`;
  }

  const todayMax = Math.round(data.daily.temperature_2m_max[0]);
  const todayMin = Math.round(data.daily.temperature_2m_min[0]);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="place">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
        <div>
          <div class="place-name">${place}</div>
          <div class="updated">Actualizado a las ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}</div>
        </div>
      </div>
      <div class="iconbtn" id="refreshBtn" onclick="refresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
      </div>
    </div>

    <div class="hero">
      <div class="hero-icon">${iconFor(cur.weather_code, cur.is_day)}</div>
      <div class="temp">${Math.round(cur.temperature_2m)}<sup>°C</sup></div>
      <div class="cond">${(WMO[cur.weather_code]||WMO[2]).t}</div>
      <div class="feels">Sensación térmica ${Math.round(cur.apparent_temperature)}°</div>
      <div class="minmax"><span>Máx <b>${todayMax}°</b></span><span>Mín <b>${todayMin}°</b></span></div>
    </div>

    <div class="section-label">Próximas 24 horas</div>
    <div class="hourly">${hourlyHtml}</div>

    <div class="section-label">Pronóstico</div>
    <div class="tabs">
      <div class="tab-indicator" id="tabInd"></div>
      <div class="tab active" data-tab="daily" onclick="switchTab('daily')">Diario</div>
      <div class="tab" data-tab="weekly" onclick="switchTab('weekly')">Semanal</div>
      <div class="tab" data-tab="monthly" onclick="switchTab('monthly')">Mensual</div>
    </div>

    <div class="panel active" id="panel-daily">${dailyPanel()}</div>
    <div class="panel" id="panel-weekly">${weeklyPanel()}</div>
    <div class="panel" id="panel-monthly">${monthlyPanel()}</div>

    <div class="section-label">Detalles</div>
    <div class="bento">
      <div class="bcard">
        <div class="b-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
          Humedad
        </div>
        <div class="b-value">${cur.relative_humidity_2m}<span>%</span></div>
      </div>
      <div class="bcard">
        <div class="b-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-2.6-4.5M3 16h14a3 3 0 1 1-2.6 4.5M3 12h8"/></svg>
          Viento
        </div>
        <div class="b-value">${Math.round(cur.wind_speed_10m)}<span>km/h</span></div>
      </div>
      <div class="bcard">
        <div class="b-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
          Presión
        </div>
        <div class="b-value">${Math.round(cur.surface_pressure)}<span>hPa</span></div>
      </div>
      <div class="bcard">
        <div class="b-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/></svg>
          Índice UV
        </div>
        <div class="b-value">${Math.round(data.daily.uv_index_max[0])}<span>${uvLabel(data.daily.uv_index_max[0])}</span></div>
      </div>
      <div class="bcard" style="grid-column:span 2;">
        <div class="b-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 18h20M4 18a8 8 0 0 1 16 0"/><path d="M12 4v6M8.5 6.5 12 10l3.5-3.5"/></svg>
          Amanecer y atardecer
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">
          <div><div class="b-value" style="font-size:19px;">${fmtTime(data.daily.sunrise[0])}</div><div class="b-note">Amanecer</div></div>
          <div style="text-align:right;"><div class="b-value" style="font-size:19px;">${fmtTime(data.daily.sunset[0])}</div><div class="b-note">Atardecer</div></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="brand">SK<span>Y</span>RA</div>
      <div class="attrib">Ubicación por GPS del dispositivo · Datos meteorológicos Open-Meteo<br>Diseño minimalista inspirado en la interfaz MIUI</div>
    </div>
  `;
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}
function uvLabel(v){
  if(v<3) return ' bajo';
  if(v<6) return ' medio';
  if(v<8) return ' alto';
  if(v<11) return ' muy alto';
  return ' extremo';
}

function dailyPanel(){
  const {data} = STATE;
  const hourly = data.hourly;
  const now = new Date();
  const startIdx = Math.max(0, hourly.time.findIndex(t => new Date(t) >= now));
  let rows = '';
  for(let i=startIdx; i<startIdx+12 && i<hourly.time.length; i+=1){
    const t = hourly.time[i];
    const code = hourly.weather_code[i];
    const isDay = (new Date(t).getHours() >=6 && new Date(t).getHours()<19) ? 1:0;
    rows += `<div class="row">
      <div class="r-day" style="width:56px;">${i===startIdx?'Ahora':fmtHour(t)}</div>
      ${iconFor(code, isDay)}
      <div class="bar-wrap"><div class="r-sub" style="width:auto;">${(WMO[code]||WMO[2]).t}</div></div>
      <div class="r-pop">${hourly.precipitation_probability[i]}%</div>
      <div class="bar-max" style="width:34px;">${Math.round(hourly.temperature_2m[i])}°</div>
    </div>`;
  }
  return `<div class="disclaimer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
    Vista horaria de hoy, calculada con tu posición exacta para máxima precisión.
  </div>${rows}`;
}

function weeklyPanel(){
  const {data} = STATE;
  const d = data.daily;
  const allMax = Math.max(...d.temperature_2m_max.slice(0,7));
  const allMin = Math.min(...d.temperature_2m_min.slice(0,7));
  const span = Math.max(1, allMax-allMin);
  let rows = '';
  for(let i=0;i<7;i++){
    const isDay=1;
    const left = ((d.temperature_2m_min[i]-allMin)/span*100).toFixed(0);
    const width = (((d.temperature_2m_max[i]-d.temperature_2m_min[i]))/span*100).toFixed(0);
    rows += `<div class="row">
      <div><div class="r-day">${fmtDayLong(d.time[i])}</div><div class="r-sub">${fmtDate(d.time[i])}</div></div>
      ${iconFor(d.weather_code[i], isDay)}
      <div class="r-pop">${d.precipitation_probability_max[i]}%</div>
      <div class="bar-min">${Math.round(d.temperature_2m_min[i])}°</div>
      <div class="bar-track"><div class="bar-fill" style="left:${left}%; width:${width}%;"></div></div>
      <div class="bar-max">${Math.round(d.temperature_2m_max[i])}°</div>
    </div>`;
  }
  return rows;
}

function monthlyPanel(){
  const {data} = STATE;
  const d = data.daily;
  const total = d.time.length; // up to 16
  const allMax = Math.max(...d.temperature_2m_max);
  const allMin = Math.min(...d.temperature_2m_min);
  const span = Math.max(1, allMax-allMin);
  let html = `<div class="disclaimer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
    Un pronóstico "mensual" preciso día a día no existe: ningún modelo meteorológico es fiable más allá de ~10-16 días. Esto es la tendencia extendida real (hasta 16 días); pasado ese punto sólo hay estimaciones climáticas generales, no un pronóstico exacto.
  </div>`;
  let weekIdx = 1;
  for(let i=0;i<total;i++){
    if(i%7===0){ html += `<div class="week-label">Semana ${weekIdx++}</div>`; }
    const left = ((d.temperature_2m_min[i]-allMin)/span*100).toFixed(0);
    const width = (((d.temperature_2m_max[i]-d.temperature_2m_min[i]))/span*100).toFixed(0);
    html += `<div class="row">
      <div><div class="r-day">${fmtDayShort(d.time[i])}</div><div class="r-sub">${fmtDate(d.time[i])}</div></div>
      ${iconFor(d.weather_code[i], 1)}
      <div class="r-pop">${d.precipitation_probability_max[i]}%</div>
      <div class="bar-min">${Math.round(d.temperature_2m_min[i])}°</div>
      <div class="bar-track"><div class="bar-fill" style="left:${left}%; width:${width}%;"></div></div>
      <div class="bar-max">${Math.round(d.temperature_2m_max[i])}°</div>
    </div>`;
  }
  return html;
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  const order = ['daily','weekly','monthly'];
  const idx = order.indexOf(name);
  document.getElementById('tabInd').style.transform = `translateX(${idx*100}%)`;
}

async function refresh(){
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.classList.add('spin');
  if(STATE){
    try{ await loadWeather(STATE.lat, STATE.lon); }catch(e){}
  }
  if(btn) btn.classList.remove('spin');
}
</script>
</body>
</html>
